<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הקורסים שלנו">
<title>הקורסים שלנו · שנה א' סמסטר א'</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f8f6; --surface:#ffffff; --ink:#20393a; --muted:#647e7c; --faint:#93a8a6;
  --line:#dfeae6; --line2:#ebf2ef;
  --accent:#5f9e93; --accent-ink:#2f6a61; --accent-soft:#e2f1ec;
  --blue:#7fa9c9; --blue-ink:#3b6584; --blue-soft:#e4eef6;
  --warn-soft:#fbf3e4; --warn-ink:#8a6a2e;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(32,57,58,.04),0 4px 14px rgba(32,57,58,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(243,248,246,.88);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#cfe9e1,#d6e6f4);display:grid;place-items:center;flex:none}
.brand b{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.1;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14.5px}
.iconbtn:hover{border-color:#c9dcd6}

/* bottom nav */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding:0 6px}
.tabs .pill{padding:3px 12px!important}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--faint);font-size:12.5px;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--accent-ink)}
.tabs a.on .pill{background:var(--accent-soft)}
.tabs .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center}

/* type */
h1{font-size:26px;line-height:1.2;margin:22px 0 4px;letter-spacing:-.015em;font-weight:800}
h2{font-size:15px;font-weight:700;color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 a{font-size:14px;color:var(--accent-ink);text-decoration:none;font-weight:600}
.lead{color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.list{overflow:hidden}
.list > *{border-bottom:1px solid var(--line2)}
.list > *:last-child{border-bottom:0}

/* hero */
.hero{padding:20px;display:grid;gap:14px;background:linear-gradient(135deg,#e3f2ed 0%,#e5eef7 100%);border:1px solid #d6e7e2}
.hero .k{font-size:13px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
.hero .t{font-size:21px;font-weight:800;line-height:1.25}
.hero .meta{color:var(--muted);font-size:14.5px}
.count{display:flex;gap:8px}
.count div{background:rgba(255,255,255,.75);border-radius:12px;padding:8px 12px;min-width:66px;text-align:center}
.count b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:11px;padding:8px 13px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn svg{width:16px;height:16px}

/* exam rows */
.exam{display:flex;gap:14px;align-items:center;padding:12px 14px;text-decoration:none}
.date{flex:none;width:54px;border-radius:12px;text-align:center;padding:6px 0;background:var(--tint,#eef4f2);color:var(--tint-ink,var(--ink))}
.date b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.date span{font-size:11.5px;font-weight:600}
.exam .body{flex:1;min-width:0}
.exam .name{font-weight:700;line-height:1.3}
.exam .sub{color:var(--muted);font-size:13.5px}
.exam .side{flex:none;text-align:left;display:grid;gap:4px;justify-items:end}
.days{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 9px;border-radius:99px;white-space:nowrap}
.days.near{color:var(--warn-ink);background:var(--warn-soft)}
.days.past{color:var(--faint);background:#f1f4f3}
.cal{font-size:12.5px;color:var(--blue-ink);text-decoration:none;font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.cal svg{width:14px;height:14px}
.crunch{font-size:12.5px;color:var(--warn-ink);font-weight:600}
.exam.past{opacity:.5}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--tint,#eef4f2);color:var(--tint-ink,var(--muted));white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tint-dot,#9bb);flex:none;display:inline-block}

/* course grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.course{padding:16px;text-decoration:none;display:grid;gap:10px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.course:hover{transform:translateY(-1px);border-color:#cfe0da}
.course::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--tint-dot)}
.course .n{font-weight:800;font-size:17px;line-height:1.25}
.course .l{color:var(--muted);font-size:13.5px}
.course .f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tint-dot,var(--accent));border-radius:99px;transition:width .3s}

/* course page */
.band{margin:0 -18px;padding:22px 18px 18px;background:var(--tint);border-bottom:1px solid rgba(0,0,0,.04)}
.band h1{margin:6px 0 8px;color:var(--tint-ink)}
.crumbs{font-size:13.5px;color:var(--tint-ink);opacity:.8;text-decoration:none;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.7);border-radius:99px;padding:3px 11px;font-size:14px;font-weight:600}
.note{padding:12px 14px;border-radius:var(--r-sm);background:var(--blue-soft);color:var(--blue-ink);font-size:14.5px;margin-top:14px}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.mat{display:flex;align-items:center;gap:12px;padding:11px 14px}
.mat a{flex:1;min-width:0;text-decoration:none;font-weight:600;line-height:1.35}
.mat a:hover{color:var(--accent-ink)}
.mat .src{font-size:12px;color:var(--faint);font-weight:600;display:block}
.ft{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;width:38px;text-align:center;padding:4px 0;border-radius:7px;background:#eef3f2;color:var(--muted)}
.ft.pdf{background:#fbeee9;color:#a5614a}.ft.docx,.ft.doc,.ft.rtf{background:var(--blue-soft);color:var(--blue-ink)}.ft.pptx{background:#fbf1e1;color:#9a6a24}
.tick{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid #c8d8d4;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tick[aria-pressed="true"] svg{opacity:1}
.mat.done a{color:var(--muted);text-decoration:line-through;text-decoration-color:#c5d4d1}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.missing{display:grid;gap:8px;padding:14px}
.missing div{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.missing span{color:var(--faint)}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;font-weight:600}
.folder svg{width:20px;height:20px;color:var(--accent);flex:none}
.folder:hover{color:var(--accent-ink)}

/* search */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;margin-top:16px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:transparent;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--faint)}
mark{background:#d8efe7;color:inherit;border-radius:3px;padding:0 1px}

/* pick */
.pick label{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;font-weight:600}
.pick input{width:20px;height:20px;accent-color:var(--accent)}

/* plan */
.plan{padding:14px;display:grid;gap:8px}
.plan .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plan .h b{font-size:16.5px}
.plan .s{font-size:14px;color:var(--muted)}
.plan .go{font-weight:700;color:var(--accent-ink)}
.plan .go.now{color:var(--warn-ink)}
.timeline{padding:16px 14px 10px}
.tl{position:relative;height:56px;margin:0 6px}
.tl .axis{position:absolute;top:26px;inset-inline:0;height:4px;border-radius:99px;background:var(--line2)}
.tl .mo{position:absolute;top:36px;font-size:11.5px;color:var(--faint);transform:translateX(50%);white-space:nowrap}
.tl .pt{position:absolute;top:19px;width:18px;height:18px;margin-right:-9px;border-radius:50%;border:3px solid #fff;background:var(--tint-dot);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.tl .today{position:absolute;top:8px;bottom:22px;width:2px;background:var(--accent);border-radius:2px}
.tl .today::after{content:"היום";position:absolute;top:-8px;right:-12px;font-size:10.5px;font-weight:700;color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);padding:0 14px 14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
select{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(32,57,58,.22);z-index:40;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(330px,86vw);background:var(--surface);z-index:41;transform:translateX(-105%);transition:transform .22s ease;
  padding:calc(16px + env(safe-area-inset-top)) 0 16px;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
.drawer.open{transform:none}
.drawer h3{margin:4px 18px 10px;font-size:14px;color:var(--muted)}
.drawer a{display:flex;align-items:center;gap:10px;padding:11px 18px;text-decoration:none;font-weight:600}
.drawer a:hover,.drawer a.on{background:var(--accent-soft)}
.drawer hr{border:0;border-top:1px solid var(--line2);margin:10px 0}
.foot{margin:36px 0 10px;color:var(--faint);font-size:13px;text-align:center;line-height:1.7}
.foot a{color:var(--muted)}
.empty{padding:18px;color:var(--muted);text-align:center}
/* live class banner */
.live{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-top:16px;border-radius:var(--r);
  background:var(--blue-soft);border:1px solid #d3e3ef}
.live.now{background:#e0f2ea;border-color:#c6e6d8}
.live .k{font-size:13px;font-weight:700;color:var(--blue-ink)}
.live.now .k{color:var(--accent-ink)}
.live .t{font-weight:800;font-size:18px;line-height:1.3}
.live .s{font-size:14px;color:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-inline-end:6px;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(95,158,147,.5)}70%{box-shadow:0 0 0 8px rgba(95,158,147,0)}100%{box-shadow:0 0 0 0 rgba(95,158,147,0)}}
/* tasks */
.task{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
.task .body{flex:1;min-width:0;display:grid;gap:3px}
.task .ttl{font-weight:700;line-height:1.35}
.task .sub{font-size:13.5px;color:var(--muted)}
.task .det{font-size:14px;color:var(--ink);white-space:pre-line}
.task .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;align-items:center}
.task .acts a{font-size:13px;font-weight:600;color:var(--blue-ink);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.task .acts svg{width:14px;height:14px}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:#c5d4d1}
.type{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:#eef3f2;color:var(--muted)}
.type.hw{background:var(--blue-soft);color:var(--blue-ink)}
.type.work{background:#f3ecf8;color:#6d5590}
.type.quiz{background:var(--warn-soft);color:var(--warn-ink)}
.type.msg{background:var(--accent-soft);color:var(--accent-ink)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--faint);margin-top:10px}
.sync button{border:0;background:none;color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:12.5px;padding:2px 4px}
.week{padding:6px 0}
.week .d{display:flex;gap:12px;padding:9px 14px;align-items:baseline}
.week .d b{flex:none;width:52px;font-size:14px;color:var(--muted)}
.week .d.today b{color:var(--accent-ink)}
.week .d div{display:flex;flex-wrap:wrap;gap:6px}
.week .slot{font-size:13.5px;font-weight:600;padding:2px 9px;border-radius:8px;background:var(--tint);color:var(--tint-ink);text-decoration:none}
@media (min-width:760px){ h1{font-size:30px} .hero{grid-template-columns:1fr auto;align-items:center} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home">
    <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6a61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/></svg></span>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>קורסים
  </button>
</div></header>

<div id="app"></div>

<nav class="tabs" aria-label="ניווט"><div class="wrap">
  <a href="#home" data-r="home"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>בית</a>
  <a href="#tasks" data-r="tasks"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span>משימות</a>
  <a href="#exams" data-r="exams"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>מבחנים</a>
  <a href="#plan" data-r="plan"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>חזרה</a>
  <a href="#search" data-r="search"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>חיפוש</a>
</div></nav>

function gviz(sheet){
  return new Promise((resolve, reject) => {
    const cb = 'gv_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { clearTimeout(t); try{ delete window[cb]; }catch(_){ window[cb] = undefined; } s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('timeout')); }, 15000);
    window[cb] = r => { done(); r && r.status !== 'error' && r.table ? resolve(r.table) : reject(new Error('sheet')); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=responseHandler:' + cb
      + '&headers=1&sheet=' + encodeURIComponent(sheet) + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
// one cell from gviz → plain string; dates → YYYY-MM-DD, times → HH:MM
function cellVal(c){
  if (!c || c.v == null || c.v === '') return '';
  const v = c.v;
  if (Array.isArray(v)) return pad(v[0]) + ':' + pad(v[1] || 0);
  if (typeof v === 'string'){
    const m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
    if (m){ if (+m[1] < 1901) return pad(m[4]||0) + ':' + pad(m[5]||0);
      return m[1] + '-' + pad(+m[2]+1) + '-' + pad(m[3]); }
    return v.trim();
  }
  if (typeof v === 'number' && c.f) return String(c.f).trim();
  return String(v).trim();
}
function sheetRows(table){
  let cols = table.cols.map(c => (c.label || '').trim());
  let rows = table.rows.map(r => (r.c || []).map(cellVal));
  if (!cols.some(Boolean) && rows.length){ cols = rows[0]; rows = rows.slice(1); }
  return rows.map(r => { const o = {}; cols.forEach((k, i) => { if (k) o[k] = r[i] || ''; }); return o; })
             .filter(o => Object.values(o).some(Boolean));
}
function normDate(s){
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?$/);
  if (!m) return '';
  let y = m[3] ? +m[3] : null; if (y && y < 100) y += 2000;
  if (!y){ const t = today0(); y = t.getFullYear(); if (new Date(y, +m[2]-1, +m[1]) < new Date(t - 120*864e5)) y++; }
  return y + '-' + pad(m[2]) + '-' + pad(m[1]);
}
// A sheet in US format reads 8/11 as August 11. If a date lands months in the past but
// swapping day and month gives a date in the current semester, it was meant the Israeli way.
function fixSwap(iso){
  if (!iso) return iso; const [y,m,d] = iso.split('-').map(Number);
  if (d > 12 || daysTo(iso) > -30) return iso;
  const alt = y + '-' + pad(d) + '-' + pad(m); const n = daysTo(alt);
  return n >= -30 && n <= 240 ? alt : iso;
}
function normTime(s){ const m = String(s||'').match(/^(\d{1,2})[:.](\d{2})/); return m ? pad(m[1]) + ':' + m[2] : ''; }

}

async function loadLive(){
  if (!sheetReady()) return;
  LIVE.state = 'loading'; paintSync();
  try{
    const [t, s] = await Promise.all([gviz('משימות'), gviz('מערכת שעות')]);
    LIVE.tasks = sheetRows(t).map((r, i) => {
      const c = courseFrom(r['קורס']); const type = (r['סוג'] || 'שיעורי בית').trim();
      return { id: 'r' + i + ':' + (r['כותרת']||'') + (r['תאריך']||''), c: c ? c.id : null, type, k: TYPES[type] || 'hw',
        title: r['כותרת'] || (r['סוג'] ? type : ''), date: fixSwap(normDate(r['תאריך'])), time: normTime(r['שעה']),
        det: r['פרטים'] || '', link: /^https?:\/\//.test(r['קישור']||'') ? r['קישור'] : '' };
    }).filter(x => x.title);
    LIVE.schedule = sheetRows(s).map(r => {
      const c = courseFrom(r['קורס']); const d = String(r['יום']||'').replace(/^יום\s*/,'').replace(/['׳]/g,'').trim();
      return { c: c ? c.id : null, day: DAYIDX[d], start: normTime(r['התחלה']), end: normTime(r['סיום']),
        place: r['מיקום'] || '', link: /^https?:\/\//.test(r['קישור']||'') ? r['קישור'] : '' };
    }).filter(x => x.c && x.day != null && x.start);
    LIVE.at = Date.now(); LIVE.state = 'ok';
    store.set('live', { tasks: LIVE.tasks, schedule: LIVE.schedule, at: LIVE.at });
  }catch(e){ LIVE.state = 'error'; }
  const r = (location.hash||'').slice(1);
  if (r !== 'search' && r !== 'pick'){ const y = scrollY; render(); scrollTo(0, y); } else paintSync();
}
function syncLine(){
  if (!sheetReady()) return '';
  const ago = LIVE.at ? Math.round((Date.now() - LIVE.at)/6e4) : null;
  const txt = LIVE.state === 'loading' ? 'מתעדכן…' : LIVE.state === 'error' ? 'לא הצלחתי להתעדכן עכשיו' + (LIVE.at ? ', מוצג המידע האחרון' : '')
    : ago == null ? '' : ago < 1 ? 'מעודכן עכשיו' : 'עודכן לפני ' + (ago < 60 ? ago + ' דק׳' : Math.round(ago/60) + ' שע׳');
  return `<div class="sync" id="sync"><span>${txt}</span>${LIVE.state !== 'loading' ? '<button type="button" data-refresh="1">רענון</button>' : ''}</div>`;
}
function paintSync(){ const el = $('#sync'); if (el) el.outerHTML = syncLine(); }

/* ---------- classes: next / live ---------- */
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
function slotNext(sl, now = new Date()){
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (let i = 0; i < 8; i++){
    const d = new Date(base.getTime() + i*864e5); if (d.getDay() !== sl.day) continue;
    const s = new Date(d.getTime() + toMin(sl.start)*6e4);
    const e = new Date(d.getTime() + toMin(sl.end || sl.start)*6e4 + (sl.end ? 0 : 90*6e4));
    if (e > now) return { s, e };
  }
  return null;
}
function nextClass(onlyMine = true, cid = null){
  const now = new Date();
  return LIVE.schedule.filter(sl => (!onlyMine || isMine(sl.c)) && (!cid || sl.c === cid))
    .map(sl => ({ sl, ...slotNext(sl, now) })).filter(x => x.s).sort((a,b) => a.s - b.s)[0] || null;
}
function classBanner(cid){
  const n = nextClass(!cid, cid); if (!n) return '';
  const c = byId(n.sl.c); const now = new Date(); const mins = Math.round((n.s - now)/6e4);
  let k, t;
  if (mins <= 0){ k = '<span class="pulse"></span>השיעור מתקיים עכשיו'; t = esc(c.short); }
  else if (mins < 60){ k = 'השיעור מתחיל בעוד ' + mins + ' דקות'; t = esc(c.short); }
  else if (mins < 24*60 && n.s.getDate() === now.getDate()){ const h = Math.floor(mins/60), m = mins%60;
    k = 'השיעור הבא היום, בעוד ' + h + (h === 1 ? ' שעה' : ' שעות') + (m ? ' ו-' + m + ' דק׳' : ''); t = esc(c.short); }
  else { k = 'השיעור הבא'; t = esc(c.short) + ' · יום ' + DAYS[n.s.getDay()]; }
  const live = mins < 60;
  return `<div class="live${mins <= 0 ? ' now' : ''}" style="${tintVars(c)}">
    <div><div class="k">${k}</div><div class="t">${t}</div>
      <div class="s"><span dir="ltr">${n.sl.start}${n.sl.end ? '–' + n.sl.end : ''}</span>${n.sl.place ? ' · ' + esc(n.sl.place) : ''}</div></div>
    ${n.sl.link ? `<a class="btn ${live ? 'primary' : 'soft'}" href="${esc(n.sl.link)}" target="_blank" rel="noopener">${/zoom/i.test(n.sl.link) ? 'כניסה לזום' : 'קישור לשיעור'}</a>` : ''}
  </div>`;
}
function weekView(){
  const mine = LIVE.schedule.filter(sl => isMine(sl.c)); if (!mine.length) return '';
  const td = new Date().getDay();
  const days = [0,1,2,3,4,5].map(d => ({ d, s: mine.filter(x => x.day === d).sort((a,b) => a.start.localeCompare(b.start)) })).filter(x => x.s.length);
  return `<h2>מערכת השבוע</h2><div class="card week">${days.map(x => `<div class="d${x.d === td ? ' today' : ''}"><b>${DAYS[x.d]}</b><div>${x.s.map(sl => `<a class="slot" href="#c-${sl.c}" style="${tintVars(byId(sl.c))}">${sl.start} ${esc(byId(sl.c).short)}</a>`).join('')}</div></div>`).join('')}</div>`;
}

/* ---------- tasks ---------- */
const doneTasks = () => new Set(store.get('doneTasks', []));
const dueTasks = () => LIVE.tasks.filter(t => t.k !== 'msg');
const msgs = () => LIVE.tasks.filter(t => t.k === 'msg');
function taskCal(t){
  const c = byId(t.c); const s = toDate(t.date, t.time || '09:00'); const e = new Date(s.getTime() + (t.time ? 30 : 60)*6e4);
  const f = x => x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action:'TEMPLATE',
    text: t.type + (c ? ' – ' + c.short : '') + ': ' + t.title, dates: f(s)+'/'+f(e), ctz:'Asia/Jerusalem', details: t.det + (t.link ? '\n' + t.link : '') });
}
function taskRow(t, opts = {}){
  const c = byId(t.c); const d = doneTasks().has(t.id); const n = t.date ? daysTo(t.date) : null;
  const due = t.date ? `${t.k === 'msg' ? '' : 'להגשה עד '}יום ${DAYS[toDate(t.date).getDay()]} ${shortDate(t.date)}${t.time ? ' · ' + t.time : ''}` : '';
  return `<div class="task${d ? ' done' : ''}" style="${c ? tintVars(c) : ''}">
    ${t.k !== 'msg' ? `<button class="tick" type="button" data-t="${esc(t.id)}" aria-pressed="${d}" aria-label="סימון: סיימתי">${ICON.check}</button>` : ''}
    <div class="body">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="type ${t.k}">${esc(t.type)}</span>${c && !opts.noCourse ? `<a class="tag" href="#c-${c.id}" style="text-decoration:none"><i class="dot"></i>${esc(c.short)}</a>` : ''}</div>
      <div class="ttl">${esc(t.title)}</div>
      ${due ? `<div class="sub">${due}</div>` : ''}
      ${t.det ? `<div class="det">${esc(t.det)}</div>` : ''}
      <div class="acts">${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${ICON.ext}לקישור</a>` : ''}
        ${t.date && n >= 0 && t.k !== 'msg' ? `<a href="${esc(taskCal(t))}" target="_blank" rel="noopener">${ICON.cal}ליומן</a>` : ''}</div>
    </div>
    ${n != null && t.k !== 'msg' ? `<span class="days ${n < 0 ? 'past' : n <= 3 ? 'near' : ''}">${d ? 'הוגש ✓' : daysLabel(n)}</span>` : ''}
  </div>`;
}
const sortTasks = l => l.slice().sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||''));

function tasksView(){
  if (!sheetReady()) return `<main class="wrap"><h1>משימות</h1><div class="card empty">עוד לא חיברנו את טבלת העדכונים.</div></main>`;
  const f = store.get('taskFilter', 'all'); const hide = store.get('hideDone', false); const dn = doneTasks();
  let l = dueTasks().filter(t => !t.c || isMine(t.c)).filter(t => f === 'all' || t.k === f);
  if (hide) l = l.filter(t => !dn.has(t.id));
  const up = sortTasks(l.filter(t => !t.date || daysTo(t.date) >= 0)), past = sortTasks(l.filter(t => t.date && daysTo(t.date) < 0)).reverse();
  const b = (v, lbl) => `<button type="button" data-tf="${v}" aria-pressed="${f === v}">${lbl}</button>`;
  const m = msgs().filter(t => !t.c || isMine(t.c));
  return `<main class="wrap">
    <h1>משימות</h1>
    <p class="lead">שיעורי בית, עבודות ובחנים מכל הקורסים שלך. סימון ✓ נשמר רק אצלך.</p>
    <div class="seg">${b('all','הכל')}${b('hw','שיעורי בית')}${b('work','עבודות')}${b('quiz','בחנים')}
      <button type="button" data-hide="1" aria-pressed="${hide}">להסתיר מה שסיימתי</button></div>
    <h2>להגשה</h2>
    <div class="card list">${up.map(t => taskRow(t)).join('') || '<div class="empty">אין משימות פתוחות 🎉</div>'}</div>
    ${m.length ? `<h2>הודעות</h2><div class="card list">${m.slice().reverse().map(t => taskRow(t)).join('')}</div>` : ''}
    ${past.length ? `<h2>תאריך ההגשה עבר</h2><div class="card list">${past.slice(0,15).map(t => taskRow(t)).join('')}</div>` : ''}
    ${syncLine()}
  </main>`;
}

function homeTasks(){
  const dn = doneTasks();
  const open = sortTasks(dueTasks().filter(t => (!t.c || isMine(t.c)) && !dn.has(t.id) && t.date && daysTo(t.date) >= 0 && daysTo(t.date) <= 14)).slice(0, 4);

  if (!open.length && !m.length) return '';
  return `${m.length ? `<h2>הודעות</h2><div class="card list">${m.map(t => taskRow(t)).join('')}</div>` : ''}
    ${open.length ? `<h2>להגשה בקרוב <a href="#tasks">כל המשימות</a></h2><div class="card list">${open.map(t => taskRow(t)).join('')}</div>` : ''}`;
}

function examsView(){
  const filt = store.get('examFilter', 'all'); const onlyMine = store.get('examMine', true);
  let list = examsSorted().filter(e => (!onlyMine || isMine(e.c)) && (filt === 'all' || e.moed === filt));
  const showPast = store.get('showPast', false);
  const past = list.filter(e => daysTo(e.date) < 0).length;
  if (!showPast) list = list.filter(e => daysTo(e.date) >= 0);
  // crunch: exams of moed א close to each other
  const groups = {}; let prev = null;
  list.forEach(e => {
    let crunch = '';
    if (prev){ const gap = Math.round((toDate(e.date) - toDate(prev.date)) / 864e5); if (gap > 0 && gap <= 3) crunch = gap === 1 ? 'יום אחרי המבחן הקודם' : gap + ' ימים אחרי המבחן הקודם'; }
    prev = e;
    const x = toDate(e.date); const key = MONTHS[x.getMonth()] + ' ' + x.getFullYear();
    (groups[key] = groups[key] || []).push(examRow(e, { full:true, crunch }));
  });
  const b = (v, l, k, cur) => `<button type="button" data-${k}="${v}" aria-pressed="${cur === v}">${l}</button>`;
  return `<main class="wrap">
    <h1>לוח מבחנים</h1>
    <p class="lead">מקור: ${esc(DATA.sources.exams)}. החדרים עוד לא נקבעו. על מועד חשוב תמיד כדאי לבדוק גם במודל.</p>
    <div class="seg" id="ef">${b('all','הכל','f',filt)}${b('א',"מועד א'",'f',filt)}${b('ב',"מועד ב'",'f',filt)}
      <button type="button" data-mine="1" aria-pressed="${onlyMine}">רק הקורסים שלי</button>
      ${past ? `<button type="button" data-past="1" aria-pressed="${showPast}">להציג מבחנים שעברו (${past})</button>` : ''}</div>
    ${Object.keys(groups).length ? Object.entries(groups).map(([k,v]) => `<h2>${k}</h2><div class="card list">${v.join('')}</div>`).join('') : '<div class="card empty">אין מבחנים להצגה</div>'}
    ${DATA.courses.filter(c => !DATA.exams.some(e => e.c === c.id)).length ? `<div class="note">בלי מבחן בלוח: ${DATA.courses.filter(c => !DATA.exams.some(e => e.c === c.id)).map(c => esc(c.short)).join(', ')}. ייתכן שיש בהם עבודה או הגשה במקום מבחן.</div>` : ''}
    ${footer()}
  </main>`;
}

function planView(){
  const lead = store.get('lead', 14);
  const all = examsSorted().filter(e => isMine(e.c));
  const ups = all.filter(e => e.moed === 'א' && daysTo(e.date) >= 0);
  // timeline of all moed א exams
  const span = all.length ? [toDate(all[0].date) < today0() ? toDate(all[0].date) : today0(), toDate(all[all.length-1].date)] : null;
  let tl = '';
  if (span){
    const a = Math.min(span[0], today0()), z = +span[1] + 864e5*3; const pos = d => ((+d - a) / (z - a)) * 100;
    const months = []; const m0 = new Date(a); m0.setDate(1); m0.setMonth(m0.getMonth()+1);
    for (let d = new Date(m0); d <= z; d.setMonth(d.getMonth()+1)) months.push(`<span class="mo" style="right:${pos(d)}%">${MONTHS[d.getMonth()]}</span>`);
    const pts = all.filter(e => e.moed === 'א').map(e => `<span class="pt" title="${esc(byId(e.c).short)} ${shortDate(e.date)}" style="right:${pos(toDate(e.date))}%;${tintVars(byId(e.c))}"></span>`).join('');
    const used = [...new Set(all.filter(e => e.moed === 'א').map(e => e.c))].map(id => byId(id));
    tl = `<div class="card"><div class="timeline"><div class="tl"><div class="axis"></div>${months.join('')}<span class="today" style="right:${pos(today0())}%"></span>${pts}</div></div>
      <div class="legend">${used.map(c => `<span style="${tintVars(c)}"><i class="dot"></i>${esc(c.short)}</span>`).join('')}</div></div>`;
  }
  const rows = ups.map(e => {
    const c = byId(e.c); const n = daysTo(e.date); const start = new Date(toDate(e.date) - lead*864e5);
    const s = Math.round((start - today0())/864e5); const pr = progress(c);
    const go = s > 0 ? `להתחיל חזרה בעוד ${s} ימים (${start.getDate()}.${start.getMonth()+1})` : 'הגיע הזמן להתחיל חזרה';
    return `<div class="plan" style="${tintVars(c)}">
      <div class="h"><b><a href="#c-${c.id}" style="text-decoration:none">${esc(c.short)}</a></b><span class="days ${n<=7?'near':''}">${daysLabel(n)}</span></div>
      <div class="s">${longDate(e.date)} · ${e.time}</div>
      <div class="go ${s<=0?'now':''}">${go}</div>
      ${pr.n ? `<div class="bar"><i style="width:${pr.p}%"></i></div><div class="s">עברת על ${pr.k} מתוך ${pr.n} חומרים בעמוד הקורס</div>` : ''}
    </div>`; }).join('');
  return `<main class="wrap">
    <h1>תכנון חזרה</h1>
    <p class="lead">כל מבחני מועד א' שלך על ציר אחד, עם תאריך מומלץ להתחלת חזרה. ההתקדמות נספרת לפי החומרים שסימנת ✓ בעמודי הקורסים.</p>
    ${tl}
    <h2>מתחילים חזרה <label class="muted" style="font-weight:600;font-size:14px">כמה ימים לפני?
      <select id="lead">${[7,10,14,21].map(v => `<option value="${v}"${v==lead?' selected':''}>${v}</option>`).join('')}</select></label></h2>
    <div class="card list">${rows || '<div class="empty">אין מבחנים קרובים 🎉</div>'}</div>
    ${footer()}
  </main>`;
}

function searchView(){
  return `<main class="wrap">
    <h1>חיפוש</h1>
    <p class="lead">חיפוש בכל הסיכומים, הקורסים והמרצים. למשל: "מפרקים", "סוכרים", "מושגים".</p>
    <div class="card search">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'}
      <input id="q" type="search" placeholder="מה מחפשים?" autocomplete="off" value="${esc(store.get('q',''))}"></div>
    <div id="results"></div>
  </main>`;
}
function runSearch(){
  const q = ($('#q').value || '').trim(); store.set('q', q); const box = $('#results');
  if (!q){ box.innerHTML = ''; return; }
  const terms = q.toLowerCase().split(/\s+/);
  const hit = s => terms.every(t => s.toLowerCase().includes(t));
  const hl = s => { let r = esc(s); terms.forEach(t => { if (t) r = r.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => '<mark>'+m+'</mark>'); }); return r; };
  const cs = DATA.courses.filter(c => hit(c.name + ' ' + c.lecturers.join(' ')));
  const ms = []; const seen = new Set();
  DATA.courses.forEach(c => c.materials.forEach(m => { const k = c.id+m.u; if (!seen.has(k) && hit(m.t + ' ' + c.short + ' ' + m.c)) { seen.add(k); ms.push([c,m]); } }));
  const d = doneSet();
  box.innerHTML = (cs.length ? `<h2>קורסים</h2><div class="card list">${cs.map(c => `<a class="folder" href="#c-${c.id}" style="${tintVars(c)}"><i class="dot"></i>${hl(c.name)}<span class="muted" style="font-weight:400;font-size:14px">${hl(c.lecturers.join(' · '))}</span></a>`).join('')}</div>` : '')
    + `<h2>חומרים (${ms.length})</h2>` + (ms.length ? `<div class="card list">${ms.slice(0,80).map(([c,m]) => matRow(m, d, c)).join('')}</div>` : '<div class="card empty">לא נמצא. נסו מילה אחרת.</div>');
}

function matRow(m, d, course){
  const done = d.has(m.u);
  return `<div class="mat${done?' done':''}">
    <button class="tick" type="button" data-u="${esc(m.u)}" aria-pressed="${done}" aria-label="סימון: עברתי על ${esc(m.t)}">${ICON.check}</button>
    <a href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t)}<span class="src">${course ? esc(course.short) + ' · ' : ''}${esc(m.c)} · ${esc(m.s)}</span></a>
    <span class="ft ${esc(m.x)}">${esc(m.x)}</span>
  </div>`;
}

function courseView(c){
  const ex = examsSorted().filter(e => e.c === c.id);
  const cats = ['סיכומים מלאים','סיכומים לפי נושא','טבלאות ודפי עזר','מבחנים לדוגמא ושחזורים'];
  const sel = store.get('cat:'+c.id, 'all');
  const present = cats.filter(k => c.materials.some(m => m.c === k));
  const d = doneSet(); const pr = progress(c);
  const mats = present.filter(k => sel === 'all' || sel === k).map(k => `<h2>${k}</h2><div class="card list">${c.materials.filter(m => m.c === k).map(m => matRow(m, d)).join('')}</div>`).join('');
  return `<div style="${tintVars(c)}"><div class="wrap"><div class="band">
      <a class="crumbs" href="#home">→ כל הקורסים</a>
      <h1>${esc(c.name)}</h1>
      <div class="chips">${c.lecturers.map(l => `<span class="chip">${esc(l)}</span>`).join('')}</div>
    </div></div></div>
  <main class="wrap" style="${tintVars(c)}">
    ${classBanner(c.id)}
    ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
    ${(() => { const l = sortTasks(LIVE.tasks.filter(t => t.c === c.id && (t.k === 'msg' || !t.date || daysTo(t.date) >= -3)));
      return l.length ? `<h2>שיעורי בית, עבודות והודעות</h2><div class="card list">${l.map(t => taskRow(t, { noCourse: true })).join('')}</div>` : ''; })()}
    <h2>מבחנים</h2>
    ${ex.length ? `<div class="card list">${ex.map(e => examRow(e)).join('')}</div>` : '<div class="card empty">אין מבחן בלוח הבחינות</div>'}
    ${c.examNote ? `<div class="note warn">${esc(c.examNote)}</div>` : ''}
    ${c.materials.length ? `
      <h2>סיכומים וחומרים <span class="muted" style="font-weight:600">${pr.k}/${pr.n} ✓</span></h2>
      <div class="bar" style="margin-bottom:12px"><i style="width:${pr.p}%"></i></div>
      ${present.length > 1 ? `<div class="seg" id="cats">${['all',...present].map(k => `<button type="button" data-cat="${esc(k)}" aria-pressed="${sel===k}">${k==='all'?'הכל':esc(k)}</button>`).join('')}</div>` : ''}
      ${mats}` : ''}
    ${c.folders.length ? `<h2>תיקיות בדרייב</h2><div class="card list">${c.folders.map(([t,u]) => `<a class="folder" href="${esc(u)}" target="_blank" rel="noopener">${ICON.folder}${esc(t)}</a>`).join('')}</div>` : ''}
    <h2>פרטי הקורס</h2>
    <div class="card missing">
      ${c.code ? `<div><b>מספר קורס</b><span style="color:var(--ink)">${esc(c.code)}</span></div>` : ''}
      ${(() => { const sl = LIVE.schedule.filter(s => s.c === c.id);
        return `<div><b>מועד השיעור</b>${sl.length ? `<span style="color:var(--ink)">${sl.map(s => 'יום ' + DAYS[s.day] + ' <span dir="ltr">' + s.start + (s.end ? '–' + s.end : '') + '</span>' + (s.place ? ' · ' + esc(s.place) : '')).join('<br>')}</span>` : '<span>עוד לא נוסף</span>'}</div>
          ${sl.find(s => s.link) ? `<div><b>קישור לשיעור</b><a href="${esc(sl.find(s => s.link).link)}" target="_blank" rel="noopener" style="color:var(--blue-ink);font-weight:600">פתיחה</a></div>` : ''}`; })()}
    </div>
    ${footer()}
  </main>`;
}

function pickView(){
  const mine = myIds();
  return `<main class="wrap">
    <h1>הקורסים שלי</h1>
    <p class="lead">מה שתבחרי יופיע במסך הבית, בלוח המבחנים ובתכנון החזרה. הבחירה נשמרת רק במכשיר הזה.</p>
    <div class="card list pick" style="margin-top:16px">${DATA.courses.map(c => `<label style="${tintVars(c)}"><input type="checkbox" value="${c.id}"${mine.includes(c.id)?' checked':''}><i class="dot"></i>${esc(c.name)}</label>`).join('')}</div>
    <p style="margin-top:16px"><a class="btn primary" href="#home">סיום</a></p>
  </main>`;
}

function footer(){
  return `<div class="foot">עודכן ב-${shortDate(DATA.updated)} · הכל מבוסס על הידיעון ועל תיקיות הסיכומים בדרייב.<br>
    ייתכנו טעויות, ועל מועד חשוב תמיד כדאי לבדוק גם במודל.<br>
    ${DATA.sources.drive.map(([t,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(' · ')}</div>`;
}

/* ---------- drawer ---------- */
function drawer(route){
  const mine = myIds();
  const item = c => `<a href="#c-${c.id}" class="${route==='c-'+c.id?'on':''}" style="${tintVars(c)}"><i class="dot"></i>${esc(c.name)}</a>`;
  const others = DATA.courses.filter(c => !mine.includes(c.id));
  $('#drawer').innerHTML = `<h3>הקורסים שלי</h3>${DATA.courses.filter(c => mine.includes(c.id)).map(item).join('')}
    ${others.length ? `<hr><h3>שאר הקורסים</h3>${others.map(item).join('')}` : ''}
    <hr><a href="#pick">⚙︎ בחירת הקורסים שלי</a>`;
}
function setMenu(open){ $('#drawer').classList.toggle('open', open); $('#overlay').classList.toggle('open', open); $('#menu').setAttribute('aria-expanded', open); }
$('#menu').onclick = () => setMenu(!$('#drawer').classList.contains('open'));
$('#overlay').onclick = () => setMenu(false);

/* ---------- countdown ---------- */
let timer;
function tick(){
  const el = $('#count'); if (!el) return;
  const [d,t] = el.dataset.at.split('T'); let ms = toDate(d,t) - new Date(); if (ms < 0) ms = 0;
  const D = Math.floor(ms/864e5), H = Math.floor(ms/36e5)%24, M = Math.floor(ms/6e4)%60;
  el.innerHTML = `<div><b>${D}</b><span>ימים</span></div><div><b>${H}</b><span>שעות</span></div><div><b>${M}</b><span>דקות</span></div>`;
}

/* ---------- router ---------- */
function render(){
  const route = (location.hash || '#home').slice(1) || 'home';
  let html;
  if (route.startsWith('c-') && byId(route.slice(2))) html = courseView(byId(route.slice(2)));
  else html = ({ tasks:tasksView, exams:examsView, plan:planView, search:searchView, pick:pickView }[route] || homeView)();
  $('#app').innerHTML = html;
  const tab = ['tasks','exams','plan','search'].includes(route) ? route : 'home';
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.r === tab));
  drawer(route); setMenu(false);
  clearInterval(timer); tick(); timer = setInterval(tick, 30000);
  if (route === 'search'){ const q = $('#q'); q.oninput = runSearch; runSearch(); setTimeout(() => q.focus(), 50); }
  const sem = $('#sem'); sem.textContent = DATA.semester;
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tick[data-u]');
  if (t){ const d = doneSet(); const u = t.dataset.u; d.has(u) ? d.delete(u) : d.add(u); store.set('done', [...d]);
    const on = d.has(u); document.querySelectorAll('.tick').forEach(b => { if (b.dataset.u === u){ b.setAttribute('aria-pressed', on); b.closest('.mat').classList.toggle('done', on); } });
    const r = (location.hash||'').slice(1); if (r.startsWith('c-')){ const y = scrollY; render(); scrollTo(0,y); } return; }
  const tt = e.target.closest('[data-t]');
  if (tt){ const d = doneTasks(); const id = tt.dataset.t; d.has(id) ? d.delete(id) : d.add(id); store.set('doneTasks', [...d]); const y = scrollY; render(); scrollTo(0,y); return; }
  if (e.target.closest('[data-refresh]')){ loadLive(); return; }
  const tf = e.target.closest('[data-tf]'); if (tf){ store.set('taskFilter', tf.dataset.tf); render(); return; }
  if (e.target.closest('[data-hide]')){ store.set('hideDone', !store.get('hideDone', false)); render(); return; }
  const f = e.target.closest('[data-f]'); if (f){ store.set('examFilter', f.dataset.f); render(); return; }
  if (e.target.closest('[data-mine]')){ store.set('examMine', !store.get('examMine', true)); render(); return; }
  if (e.target.closest('[data-past]')){ store.set('showPast', !store.get('showPast', false)); render(); return; }
  const k = e.target.closest('[data-cat]'); if (k){ const r = (location.hash||'').slice(3); store.set('cat:'+r, k.dataset.cat); const y = scrollY; render(); scrollTo(0,y); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lead'){ store.set('lead', +e.target.value); render(); return; }
  if (e.target.closest('.pick')){ const v = [...document.querySelectorAll('.pick input:checked')].map(i => i.value); store.set('mine', v); drawer('pick'); }
});
addEventListener('hashchange', () => { render(); scrollTo(0,0); });
render();
loadLive();
// keep "class starts in…" fresh, and pull new homework when the app comes back to the screen
setInterval(() => { const r = (location.hash||'#home').slice(1); if (r === 'home' || r === '' || r.startsWith('c-')){ const y = scrollY; render(); scrollTo(0,y); } }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - LIVE.at > 120000) loadLive(); });
</script>
</body>
</html>
